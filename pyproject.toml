[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llamashift"
dynamic = ["version"]
description = "LlamaShift: GPU-aware model manager and OpenAI-compatible gateway for llama.cpp"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "flask>=3.0.0",
    "requests>=2.28.0",
    "psutil>=5.9.0",
    "websockets>=12.0",
    "mcp>=1.0.0,<2",
    "httpx>=0.27.0",
    "typing_extensions>=4.0.0",
]

[project.scripts]
llamashift = "llamashift.launcher:run"

[tool.setuptools]
# The repository root holds flat modules; ship them as one package so they do not pollute site-packages.
# The launcher puts that directory on sys.path, which keeps the modules' flat imports working.
package-dir = { "llamashift" = "." }
packages = ["llamashift"]

[tool.setuptools.package-data]
llamashift = ["static/*", "config.json.template"]

[tool.setuptools.dynamic]
version = { attr = "llamashift.version.__version__" }
